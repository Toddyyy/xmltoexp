data:
  npz_dir: ../../MIREX_Model/beat_data_mazurka_performer_levels_recomputed_sw3_20260524
  split_file: ../../MIREX_Model/splits/mazurka_piece_split_v4_35_9_0.yaml
  xml_score_dir: ../../../MazurkaBL-master/xml_scores
  xml_expand_repeats: true
  task_type: grouped_salience
  feature_level: 1
  target_groups:
    - [1, 2]
    - [3, 4]
    - [5, 6]
  group_weights:
    - 1.0
    - 2.0
    - 8.0
  group_merge: max
  target_column: boundary_peak
  beat_table_path: ../outputs/salience_grouped3_hi8_xml_recomputed_sw3_20260524/beat_table_salience_grouped3_hi8_xml_recomputed_sw3_20260524.csv.gz
  peak_distance: 6
  peak_height: 0.15
  peak_prominence: 0.05
  long_note_threshold: 1.0
  beat_unit_fallback: 1.0
  symmetry_window: 4
  deviation_window: 8
  measure_cycle: 3

evaluation:
  event_tolerance: 1
  min_distance: 6
  prominence: 0.0
  threshold_grid:
    start: 0.05
    stop: 0.95
    steps: 37

features:
  exclude:
    - mean_pitch_norm
    - pitch_range_norm
    - mean_duration_norm
    - pitch_std_norm
    - pc_cos_prev
    - xml_rest_count
    - xml_tie_start_ratio
    - xml_tie_continue_ratio
    - xml_slur_start_ratio
    - xml_repeat_start
    - xml_active_pc_entropy
    - xml_active_pc_unique_ratio
    - xml_active_pc_cos_prev
    - xml_active_pc_cos_next

sequence:
  output_dir: ../outputs/salience_grouped3_hi8_xml_recomputed_sw3_20260524/sequence
  model_type: tcn
  batch_size: 64
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stop_patience: 5
  seed: 42
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  tcn_channels:
    - 64
    - 64
    - 64
  kernel_size: 3
