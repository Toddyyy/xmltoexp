data:
  data_dir: beat_data_mazurka_performer_levels   # grouped multi-level npz files
  file_ext: npz
  beat_sequence_length: 128
  beat_stride: 128
  drop_short: true
  max_len: null
  position_mode: zero        # absolute|window|zero
  use_base_features_only: true
  label_mode: ratio          # train_beat_salience.py builds a weighted continuous target
  dist_min_dist: 6
  dist_height: 0.15
  dist_prominence: 0.05
  dist_tau: 4.0
  train_split: 0.8
  batch_size: 4
  num_workers: 0
  value_ranges:
    pitch_midi: [0.0, 127.0]
    duration: [0.0, 8.0]
    position: [0.0, 1.0]
    part_idx: [0.0, 7.0]
    is_accent: [0.0, 1.0]
    is_staccato: [0.0, 1.0]
  label_binarize_threshold: null
  piece_id_regex: '^(M\\d+-\\d+)'
  performer_id_regex: '(pid[^_]+)'

model:
  input_dim: 6
  d_model: 128
  nhead: 2
  num_layers: 2
  dim_feedforward: 512
  dropout: 0.1
  max_len: 512
  include_empty_beats: true
  performer_cond: true
  performer_emb_dim: 32

training:
  epochs: 100
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  loss_type: mse             # mse|bce|huber ; mse is the default for continuous salience
  pos_weight: null
  device: auto
  seed: 42
  freeze_base: false

trainer:
  save_dir: ./check/beat_mazurka
  experiment_name: beat_mazurka_salience
  eval_every: 1
