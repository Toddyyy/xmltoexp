data:
  data_dir: beat_data_mazurka_performer_levels
  file_ext: npz
  beat_sequence_length: 128
  beat_stride: 128
  drop_short: false
  max_len: null
  position_mode: zero
  use_base_features_only: true
  train_split: 0.8
  batch_size: 4
  num_workers: 0
  value_ranges:
    pitch_midi: [0.0, 127.0]
    duration: [0.0, 8.0]
    position: [0.0, 1.0]
    part_idx: [0.0, 7.0]
    is_accent: [0.0, 1.0]
    is_staccato: [0.0, 1.0]
  label_binarize_threshold: null
  piece_id_regex: '^(M\\d+-\\d+)'
  performer_id_regex: '(pid[^_]+)'

salience:
  levels: [1, 2, 3, 4, 5, 6]
  level_weights: [3, 6, 12, 24, 48, 96]

model:
  input_dim: 6
  d_model: 128
  nhead: 2
  num_layers: 2
  dim_feedforward: 512
  dropout: 0.1
  max_len: 512
  include_empty_beats: true
  performer_cond: false

training:
  epochs: 100
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  loss_type: bce
  pos_weight: null
  device: auto
  seed: 42
  freeze_base: false

trainer:
  save_dir: ./check/beat_mazurka
  experiment_name: beat_mazurka_salience_ratio
  eval_every: 1
